version: 0.1.0
items:
  - id: mission.one-sentence
    category: mission
    title: One-sentence mission above the fold
    check: Home page states who you serve, what you do and where, in one sentence a stranger understands within 5 seconds.
    method:
      - crawl
      - browser
    why: Funders and donors decide in seconds whether you are for them.
    severity: P1
    effort: S
    impact:
      - TRUST
      - CONVERSION
    appliesWhen:
      all: []
      any: []
    fix: Rewrite the hero line as 'We [do what] for [whom] in [where]'. Test it on someone outside the sector.
    nwkPrecedent: NWK hero rewritten to state the 16-19 cohort and the location instead of abstract mission language.
  - id: mission.audience-clear
    category: mission
    title: Primary audience and next step are explicit
    check: One primary audience per page and one clear next action; secondary audiences are routed, not mixed in.
    method:
      - browser
      - manual
    why: Pages that talk to everyone convert no one.
    severity: P1
    effort: S
    impact:
      - CONVERSION
    appliesWhen:
      all: []
      any: []
    fix: Choose the primary visitor for the home page; give each other audience (donor, partner, referrer) a labeled path.
    nwkPrecedent: NWK home page got a single next step for 12 local youth aged 16-19.
  - id: mission.no-jargon
    category: mission
    title: Plain language, no unexplained jargon
    check: No unexplained acronyms, sector jargon or inflated claims in headings and first paragraphs.
    method:
      - crawl
      - manual
    why: Jargon reads as vagueness and slows non-specialist funders.
    severity: P2
    effort: S
    impact:
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Replace jargon with concrete verbs; spell out acronyms on first use.
  - id: mission.consistent-everywhere
    category: mission
    title: Mission statement matches across site, IRS record and profiles
    check: Compare site, Form 990/determination wording, Candid/Charity Navigator and social bios.
    method:
      - crawl
      - record
      - search
    why: Mismatched descriptions are the most common trust signal funders notice.
    severity: P2
    effort: S
    impact:
      - TRUST
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: Pick one canonical mission sentence and update every profile to match.
  - id: toc.problem-to-change
    category: theory_of_change
    title: Problem, approach and intended change are connected
    check: The site explains the problem, why this approach, and what changes for participants (short-term and long-term).
    method:
      - crawl
      - manual
    why: A funder funds a believable cause-and-effect chain, not a list of activities.
    severity: P1
    effort: M
    impact:
      - FUNDING
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Add a half-page 'How change happens' with inputs, activities, outcomes and what you do not claim.
  - id: toc.honest-scope
    category: theory_of_change
    title: Claims stay within what you can prove
    check: No outcomes, counts or 'transforming lives' claims without a source or a stated measurement method.
    method:
      - crawl
      - manual
    why: Unsupported claims are a due-diligence red flag and a legal risk in solicitations.
    severity: P0
    effort: S
    impact:
      - TRUST
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: Mark every number with source and date, or remove it. Describe the plan honestly if there are no results yet.
    nwkPrecedent: NWK removed unverifiable outcome claims and labeled the program as a first cohort.
  - id: prog.what-where-who
    category: programs
    title: Each program says what, where, who and how to join
    check: Every program page has eligibility, location, schedule/dates, cost to participants and a way to apply or contact.
    method:
      - crawl
    why: Visitors leave when they cannot tell if a program is for them.
    severity: P1
    effort: M
    impact:
      - CONVERSION
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: "Use one template: What / Who it is for / Where & when / Cost / How to apply / What happens next."
    nwkPrecedent: NWK program pages standardized with eligibility and an intake form.
  - id: prog.capacity-honest
    category: programs
    title: Capacity and timing are stated honestly
    check: Cohort size, start dates and waitlists are shown, and 'coming soon' items are labeled.
    method:
      - crawl
      - manual
    why: Overpromising capacity damages trust with families and funders.
    severity: P2
    effort: XS
    impact:
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: State seats and timing; label anything not yet running.
    nwkPrecedent: NWK stated a first cohort of 12 and a coming-soon mode for unfinished areas.
  - id: prog.stale-content
    category: programs
    title: No stale dates, past events or dead program pages
    check: Search for years/dates older than 12 months on current pages, expired events, 'upcoming' items in the past.
    method:
      - crawl
    why: Stale content signals an inactive organization.
    severity: P2
    effort: S
    impact:
      - TRUST
      - OPERATIONS
    appliesWhen:
      all: []
      any: []
    fix: Archive or update; add a 'last updated' habit to the monthly care list.
  - id: evid.outcomes-sourced
    category: evidence_impact
    title: Outcomes have source, date and method
    check: Impact numbers cite year, denominator and how measured; baseline vs. result where possible.
    method:
      - crawl
      - manual
    why: Funders ask for evidence logic in every application.
    severity: P1
    effort: M
    impact:
      - FUNDING
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: "Build an evidence page: metric, value, period, method, source."
  - id: evid.stories-consent
    category: evidence_impact
    title: Stories and photos have documented consent
    check: Named people, minors and testimonials have written consent; minors are not identifiable without guardian consent.
    method:
      - manual
      - legal_review
    why: Using stories without consent is an ethical and legal exposure.
    severity: P0
    effort: S
    impact:
      - SAFETY
      - TRUST
    appliesWhen:
      all: []
      any:
        - youth_serving
        - vulnerable_population
    fix: Adopt a media-consent form and keep a log; remove anything undocumented.
    nwkPrecedent: NWK avoided identifiable minors and removed named people lacking written OK.
  - id: evid.no-fake-proof
    category: evidence_impact
    title: No fake logos, testimonials or stock presented as real
    check: Partner logos, testimonials and photos are real and permitted; stock imagery is not passed off as participants.
    method:
      - crawl
      - browser
      - manual
    why: Fabricated proof is the fastest way to lose credibility and can be deceptive-practice risk.
    severity: P0
    effort: XS
    impact:
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Remove anything you cannot document; label stock photos honestly.
    nwkPrecedent: NWK removed an unconfirmed named endorsement until written permission.
  - id: cred.legal-name
    category: credibility
    title: Legal name, EIN and status visible
    check: Footer/about shows exact legal name, EIN, 501(c)(3) status or fiscal-sponsor relationship.
    method:
      - crawl
      - record
    why: Funders and donors verify these first; donors need it for tax receipts.
    severity: P0
    effort: XS
    impact:
      - TRUST
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: "Add a footer line: '[Legal name] is a 501(c)(3) (EIN xx-xxxxxxx). Contributions are tax-deductible to the extent allowed by law.' Use the sponsor wording if fiscally sponsored (see cred.sponsor-wording)."
    nwkPrecedent: NWK footer clarified the HSI sponsorship relationship.
  - id: cred.sponsor-wording
    category: credibility
    title: Fiscal sponsorship described accurately
    check: If fiscally sponsored, the site names the sponsor, does not claim own 501(c)(3), and donation wording matches the sponsorship agreement.
    method:
      - crawl
      - manual
      - legal_review
    why: Misstating tax status is a serious donor-deception risk.
    severity: P0
    effort: S
    impact:
      - TRUST
      - FUNDING
    appliesWhen:
      all:
        - fiscally_sponsored
      any: []
    fix: Use agreed wording; get sponsor written approval; checks gifts are payable to the sponsor.
    nwkPrecedent: NWK held fundraising wording for HSI written approval before going live.
  - id: cred.irs-matches-site
    category: credibility
    title: IRS record matches site identity
    check: Name, city, state and EIN on ProPublica/IRS match the site; flag differences.
    method:
      - record
    why: Name mismatches stall grant due diligence and payment processors.
    severity: P1
    effort: XS
    impact:
      - FUNDING
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Update the site or file the name/address change with the IRS.
  - id: cred.real-people
    category: credibility
    title: Leadership and governance are real and findable
    check: Named leaders and board with roles, with permission; at least a contact person.
    method:
      - crawl
      - manual
    why: Anonymous organizations do not get funded.
    severity: P1
    effort: S
    impact:
      - TRUST
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: Publish leadership and board (with consent), roles and a contact method.
    nwkPrecedent: NWK flagged a second governor and advisers as open items.
  - id: cred.contact-reachable
    category: credibility
    title: A real contact path works
    check: Email/phone/form exist, a physical or mailing address is shown (or a stated reason it is not), and a reply is monitored.
    method:
      - crawl
      - manual
    why: Funders test the contact path.
    severity: P1
    effort: XS
    impact:
      - TRUST
      - CONVERSION
    appliesWhen:
      all: []
      any: []
    fix: Add a monitored role-based email and a mailing address or PO box.
  - id: cred.third-party-validation
    category: credibility
    title: External validation is linked
    check: Candid/GuideStar profile, press, partner letters or awards appear with links.
    method:
      - crawl
      - search
    why: Third-party proof beats self-description.
    severity: P2
    effort: M
    impact:
      - TRUST
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: Claim the Candid profile and link real mentions.
  - id: cred.consistent-names
    category: credibility
    title: Brand name, legal name and domain are used consistently
    check: Variants of the name across site, socials, emails and registries are listed and reconciled.
    method:
      - crawl
      - search
    why: Inconsistency looks careless and splits search results.
    severity: P2
    effort: S
    impact:
      - TRUST
      - SEARCH
    appliesWhen:
      all: []
      any: []
    fix: "Write a name policy: legal name, brand name, short name and where each is used."
  - id: fund.donate-path
    category: funder_readiness
    title: A donation path exists and works
    check: Donate button leads to a working, secure form with a tax-receipt statement; or states how to give.
    method:
      - crawl
      - browser
    why: Broken or hidden giving costs revenue.
    severity: P1
    effort: S
    impact:
      - FUNDING
      - CONVERSION
    appliesWhen:
      all: []
      any:
        - takes_donations
    fix: Put one giving path in the header; test a real transaction.
  - id: fund.donate-wording
    category: funder_readiness
    title: Donation and tax-deductibility wording is accurate
    check: No 'tax-deductible' claim unless true; sponsor/charity relationship stated; no promises about use of funds you cannot meet.
    method:
      - crawl
      - legal_review
    why: Misleading solicitation wording triggers state regulators.
    severity: P0
    effort: S
    impact:
      - FUNDING
      - SAFETY
    appliesWhen:
      all: []
      any:
        - takes_donations
    fix: Have the board or counsel approve the exact wording; keep a copy.
    nwkPrecedent: NWK held donate wording behind approval and a coming-soon mode.
  - id: fund.funder-page
    category: funder_readiness
    title: A 'for funders' summary exists
    check: "One page: problem, program, budget range, outcomes plan, governance, how to contact or fund."
    method:
      - crawl
    why: Program officers skim; give them a single page.
    severity: P1
    effort: M
    impact:
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: Create /funders with a two-minute story and downloadable one-pager.
    nwkPrecedent: NWK built a funder-facing facts doc and trust page.
  - id: fund.budget-visible
    category: funder_readiness
    title: Budget and use of funds are transparent
    check: Annual budget or revenue/expense summary or 990 link; plain-language use-of-funds.
    method:
      - crawl
      - record
    why: Transparency is a due-diligence checkbox.
    severity: P1
    effort: M
    impact:
      - FUNDING
      - TRUST
    appliesWhen:
      all: []
      any:
        - has_staff
        - takes_donations
        - targets_federal_grants
    fix: Publish a simple use-of-funds chart and link the 990s.
  - id: fund.grant-ready-docs
    category: funder_readiness
    title: Core grant documents are ready
    check: IRS determination letter, W-9, board list, budget, 990/financials, DEI/safeguarding policies, bios, logo pack are on file.
    method:
      - manual
    why: Applications stall for missing paperwork.
    severity: P1
    effort: M
    impact:
      - FUNDING
    appliesWhen:
      all: []
      any:
        - targets_federal_grants
    fix: Assemble a grant-readiness folder and checklist.
  - id: fund.fed-registrations
    category: funder_readiness
    title: Federal registrations in place for federal grants
    check: UEI and active SAM.gov registration; Grants.gov access; note renewal dates.
    method:
      - record
      - manual
    why: You cannot receive federal awards without active SAM registration.
    severity: P1
    effort: M
    impact:
      - FUNDING
    appliesWhen:
      all:
        - targets_federal_grants
      any: []
    fix: Start SAM.gov registration early (it can take weeks); calendar the annual renewal.
  - id: fund.found-via-search
    category: funder_readiness
    title: Funder-search visibility
    check: Searching the name plus 'nonprofit' returns registry or profile pages, not just the site.
    method:
      - search
    why: Funders often validate through Candid and ProPublica first.
    severity: P2
    effort: S
    impact:
      - SEARCH
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: Claim and complete the listings from the presence directory.
  - id: fund.funder-fit
    category: funder_readiness
    title: Target funders are named and fit-checked
    check: Known target funders' priorities, geography and size match the organization.
    method:
      - manual
    why: Applying to poor-fit funders wastes limited capacity.
    severity: P2
    effort: M
    impact:
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: List 10 fit-checked funders; use public databases and the Grants.gov search.
  - id: gov.board-listed
    category: transparency_governance
    title: Board or governing body is disclosed
    check: Board names/roles on the site or a clear reason; conflict-of-interest policy exists.
    method:
      - crawl
      - manual
    why: Governance is a core diligence area.
    severity: P1
    effort: S
    impact:
      - TRUST
      - FUNDING
    appliesWhen:
      all: []
      any: []
    fix: Publish the board list and adopt a conflict-of-interest policy.
  - id: gov.annual-report
    category: transparency_governance
    title: Annual report or impact summary is published
    check: A dated report or letter, even one page, is findable.
    method:
      - crawl
    why: Shows continuity and accountability.
    severity: P2
    effort: M
    impact:
      - TRUST
    appliesWhen:
      all: []
      any:
        - has_staff
        - takes_donations
    fix: Publish a one-page annual summary.
  - id: gov.990-link
    category: transparency_governance
    title: Form 990 is linked or discoverable
    check: 990s available on the site or via ProPublica/Candid link.
    method:
      - crawl
      - record
    why: Federal law requires making certain returns available; linking reduces requests.
    severity: P2
    effort: XS
    impact:
      - TRUST
    appliesWhen:
      all: []
      any:
        - has_staff
        - takes_donations
    fix: Link ProPublica or host PDFs.
  - id: gov.policies-exist
    category: transparency_governance
    title: Core policies exist
    check: Conflict of interest, whistleblower, document retention, gift acceptance as applicable to size.
    method:
      - manual
      - legal_review
    why: Policies are asked about on Form 990 and in diligence.
    severity: P2
    effort: M
    impact:
      - TRUST
      - OPERATIONS
    appliesWhen:
      all: []
      any:
        - has_staff
    fix: Adopt templates reviewed by counsel; record board approval.
  - id: gov.state-registration
    category: transparency_governance
    title: State charity registration and annual filings are current
    check: State charity registry shows registered and good standing where soliciting; secretary-of-state status active.
    method:
      - search
      - record
      - legal_review
    why: Soliciting without required registration can bring penalties.
    severity: P0
    effort: M
    impact:
      - FUNDING
      - SAFETY
    appliesWhen:
      all: []
      any:
        - takes_donations
    fix: Check the state charity office and registered-agent status; mark LEGAL REVIEW REQUIRED where unsure.
  - id: legal.privacy-policy
    category: legal_disclosure
    title: Privacy policy exists and matches reality
    check: Policy found from every page footer; names data collected, vendors, retention, rights, contact; matches the forms.
    method:
      - crawl
      - legal_review
    why: Required by many laws and by processors and ad platforms.
    severity: P0
    effort: M
    impact:
      - SAFETY
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Rewrite in plain language; list real vendors; add a contact for requests.
    nwkPrecedent: NWK privacy page rewritten using NTEN structure.
  - id: legal.terms
    category: legal_disclosure
    title: Terms of use exist where needed
    check: Terms for site, forms and any user submissions.
    method:
      - crawl
      - legal_review
    why: Sets rules and limits liability.
    severity: P2
    effort: S
    impact:
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Add concise terms; link in footer.
  - id: legal.cookie-consent
    category: legal_disclosure
    title: Cookie/tracker disclosure matches practice
    check: Trackers (analytics, pixels, embeds) are listed; consent where required (EU/CA visitors, some states).
    method:
      - technical
      - legal_review
    why: Undisclosed trackers are a frequent complaint basis.
    severity: P1
    effort: S
    impact:
      - SAFETY
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Inventory scripts; remove unneeded ones; add notice or consent where required.
  - id: legal.accessibility-statement
    category: legal_disclosure
    title: Accessibility statement and feedback route
    check: Statement of standard targeted, known gaps and a contact.
    method:
      - crawl
    why: Shows good faith and lowers risk.
    severity: P2
    effort: XS
    impact:
      - ACCESSIBILITY
      - TRUST
    appliesWhen:
      all: []
      any: []
    fix: Publish a short statement with a contact email.
  - id: legal.donor-privacy
    category: legal_disclosure
    title: Donor privacy policy
    check: States whether donor lists are shared or sold.
    method:
      - crawl
      - legal_review
    why: Donors ask; many platforms require it.
    severity: P1
    effort: XS
    impact:
      - TRUST
    appliesWhen:
      all: []
      any:
        - takes_donations
    fix: State plainly that donor info is not sold or shared except processors.
  - id: legal.copyright-licenses
    category: legal_disclosure
    title: Images, fonts and music are licensed
    check: Licenses for stock, fonts, music, third-party code are documented.
    method:
      - manual
    why: Takedown and demand letters are common and avoidable.
    severity: P2
    effort: S
    impact:
      - OPERATIONS
    appliesWhen:
      all: []
      any: []
    fix: Keep an asset license log; replace anything unlicensed.
  - id: legal.coppa
    category: legal_disclosure
    title: Children's data handling (COPPA) considered
    check: Forms and analytics avoid collecting personal information from under-13s without verifiable parental consent.
    method:
      - manual
      - legal_review
    why: COPPA applies to online services directed at children.
    severity: P0
    effort: M
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
        - youth_serving
    fix: Do not collect under-13 data; use guardian-completed forms.
    nwkPrecedent: NWK intake targeted ages 16-19 and used guardian paths; counsel review pending.
  - id: legal.sms-email-consent
    category: legal_disclosure
    title: Email and SMS consent and unsubscribe
    check: Opt-in language, unsubscribe in every email, SMS terms and STOP handling.
    method:
      - crawl
      - legal_review
    why: CAN-SPAM and TCPA carry real penalties.
    severity: P1
    effort: S
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
        - uses_sms_or_email_marketing
    fix: Add consent checkbox text, unsubscribe and SMS terms.
  - id: legal.employment-claims
    category: legal_disclosure
    title: Employer and jobs claims are legal and accurate
    check: Job placement or wage statements, youth employment rules (child-labor limits) are accurate for the state.
    method:
      - manual
      - legal_review
    why: Employing minors has hour and task limits; misstatements create liability.
    severity: P0
    effort: M
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
        - youth_serving
    fix: Have counsel check youth-employment statements; add compliance notes.
    nwkPrecedent: NWK closed a child-labor bypass in the database and kept employer wording gated for HSI approval.
  - id: legal.fundraising-events
    category: legal_disclosure
    title: Raffles, auctions and events comply
    check: Raffles/games of chance and event solicitations follow state rules.
    method:
      - manual
      - legal_review
    why: State rules on raffles are strict and vary.
    severity: P1
    effort: S
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
        - has_events
        - takes_donations
    fix: Check state rules before advertising.
  - id: legal.international
    category: legal_disclosure
    title: Cross-border and sanctions considerations
    check: International transfers, GDPR for EU visitors, sanctions screening.
    method:
      - manual
      - legal_review
    why: International work adds regulatory duties.
    severity: P1
    effort: M
    impact:
      - SAFETY
    appliesWhen:
      all:
        - international_work
      any: []
    fix: Get specialist advice; document the controls.
  - id: priv.forms-minimal
    category: privacy_data
    title: Forms collect only what is needed
    check: Each field has a purpose; sensitive fields (DOB, address, health) are justified.
    method:
      - crawl
      - manual
    why: Less data means less risk.
    severity: P1
    effort: S
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
        - collects_forms
    fix: Remove unnecessary fields; split sensitive data to a later step.
    nwkPrecedent: NWK trimmed intake fields and added saved-draft clearing.
  - id: privacy.forms
    category: privacy_data
    title: Forms are secure and disclose use
    check: Forms submit over HTTPS via POST, link the privacy policy and state who sees the data.
    method:
      - crawl
      - technical
    why: Plain-text or GET submission leaks data.
    severity: P0
    effort: S
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
        - collects_forms
    fix: Fix method and add disclosure text next to the submit button.
    nwkPrecedent: NWK added privacy text and server-side validation to forms.
  - id: priv.spam-abuse
    category: privacy_data
    title: Forms resist spam and abuse
    check: Rate limiting, honeypot or CAPTCHA, server validation.
    method:
      - technical
      - manual
    why: Spam floods ruin follow-up and expose data.
    severity: P2
    effort: S
    impact:
      - OPERATIONS
    appliesWhen:
      all: []
      any:
        - collects_forms
    fix: Add throttling and validation on the server.
    nwkPrecedent: NWK added rate limits and form throttles.
  - id: priv.data-stored-safely
    category: privacy_data
    title: Submissions are stored with access control
    check: Database not public; row-level security; limited admin access; backups.
    method:
      - manual
      - technical
    why: A public data table is a breach.
    severity: P0
    effort: M
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
        - collects_forms
    fix: Review roles and policies; test an anonymous read.
    nwkPrecedent: NWK enabled RLS and security-definer functions on Supabase.
  - id: priv.retention
    category: privacy_data
    title: Retention and deletion are defined
    check: How long data is kept and how to request deletion.
    method:
      - manual
    why: Regulators and funders ask.
    severity: P2
    effort: S
    impact:
      - SAFETY
    appliesWhen:
      all: []
      any:
