# Question list for counsel. Pointers only. Not legal advice. Every item: LEGAL REVIEW REQUIRED.
version: "0.1.0"
note: "Washington in depth; other states: check that state's charity office. Verify all citations with a lawyer."
items:
  - {id: fed-exempt-status, area: federal, topic: "IRS determination letter and status", question: "Is there an IRS determination letter and does the IRS search show the org as exempt and not revoked?", where_to_check: "https://apps.irs.gov/app/eos", failure_mode: "Auto-revocation after three years of missed filings; donations stop being deductible."}
  - {id: fed-990, area: federal, topic: "Annual return", question: "Are 990/990-EZ/990-N filings current?", where_to_check: "ProPublica Nonprofit Explorer", failure_mode: "Missed filings lead to revocation."}
  - {id: fed-disclosure, area: federal, topic: "Public disclosure of returns and exemption application", question: "Can the public get the 990s and exemption application on request or online?", where_to_check: "Website and Candid", failure_mode: "Penalties for refusing disclosure."}
  - {id: donor-acknowledgment, area: federal, topic: "Written acknowledgment for gifts over $250 and quid pro quo disclosures", question: "Do receipts include legal name, amount, and goods/services statement?", where_to_check: "Sample receipt", failure_mode: "Donors cannot claim the deduction."}
  - {id: fed-sponsor, area: federal, topic: "Fiscal sponsorship wording", question: "Does the site describe the sponsor relationship and who receives gifts exactly as the sponsorship agreement says?", where_to_check: "Sponsorship agreement and donate page", failure_mode: "Donors misled about tax status."}
  - {id: wa-registration, area: washington, topic: "Charitable solicitation registration", question: "Is the org registered with the Washington Secretary of State Charities Program before soliciting, and are annual reports current?", where_to_check: "https://ccfs.sos.wa.gov", failure_mode: "Penalties and inability to solicit."}
  - {id: wa-entity, area: washington, topic: "Nonprofit corporation status and registered agent", question: "Is the WA nonprofit corporation active with a current annual report and registered agent?", where_to_check: "CCFS", failure_mode: "Administrative dissolution."}
  - {id: wa-business-license, area: washington, topic: "Business license (UBI) and city licenses", question: "Does the org hold a UBI and any city licence required?", where_to_check: "WA Department of Revenue Business Licensing Service", failure_mode: "Fines and blocked grants."}
  - {id: wa-raffles, area: washington, topic: "Raffles and gambling rules", question: "If running raffles or games, are they within Washington Gambling Commission rules for nonprofits?", where_to_check: "Washington State Gambling Commission", failure_mode: "Illegal gambling exposure."}
  - {id: state-other, area: other_states, topic: "Registration in other states where donors are solicited", question: "Which states need registration given online solicitation?", where_to_check: "https://www.nasconet.org (state offices)", failure_mode: "State penalties."}
  - {id: coppa, area: privacy, topic: "Children's online privacy", question: "Does any form or tracker collect personal information from children under 13?", where_to_check: "Forms and scripts", failure_mode: "FTC enforcement."}
  - {id: state-privacy, area: privacy, topic: "State privacy laws and notices", question: "Do privacy notices cover the data collected and the visitors' rights in the states served?", where_to_check: "Privacy page", failure_mode: "Complaints and fines."}
  - {id: email-sms, area: marketing, topic: "CAN-SPAM and TCPA", question: "Are consent, unsubscribe and SMS terms in place?", where_to_check: "Signup forms and emails", failure_mode: "Per-message statutory damages for texts."}
  - {id: accessibility-law, area: accessibility, topic: "ADA and web accessibility claims", question: "Is there an accessibility statement and a process to fix reports?", where_to_check: "Site", failure_mode: "Demand letters."}
  - {id: youth-employment, area: employment, topic: "Employment of minors", question: "Do program or employer statements match state child-labor hour and task limits?", where_to_check: "Program pages and agreements", failure_mode: "Wage-and-hour liability."}
  - {id: mandated-reporting, area: safeguarding, topic: "Mandated reporting and background checks", question: "Does the safeguarding policy match state mandated-reporter and screening rules?", where_to_check: "Safeguarding policy", failure_mode: "Failure to report harm."}
  - {id: media-consent, area: safeguarding, topic: "Photo and story releases", question: "Are written releases stored for every identifiable person, with guardian consent for minors?", where_to_check: "Media library and release log", failure_mode: "Privacy and publicity claims."}
  - {id: ip-licenses, area: ip, topic: "Trademark and asset licensing", question: "Is the brand name cleared and are fonts, images and music licensed?", where_to_check: "USPTO search; license log", failure_mode: "Infringement claims."}
  - {id: insurance, area: operations, topic: "Insurance", question: "Is general liability, D&O and any program-specific cover in place?", where_to_check: "Policies", failure_mode: "Uninsured loss."}
